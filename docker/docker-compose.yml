version: "3.9"

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appuser_pw}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    # DB port intentionally NOT published to the host in prod. Uncomment for local debugging:
    # ports:
    #   - "5432:5432"

  order-service:
    build:
      context: ../services/order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-appuser_pw}
      DB_NAME: ${DB_NAME:-appdb}
      PAYMENT_SERVICE_URL: http://payment-service:4002
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  payment-service:
    build:
      context: ../services/payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      PORT: 4002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-appuser_pw}
      DB_NAME: ${DB_NAME:-appdb}
      ORDER_SERVICE_URL: http://order-service:4001
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  frontend:
    build:
      context: ../frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      ORDER_SERVICE_URL: http://order-service:4001
      PAYMENT_SERVICE_URL: http://payment-service:4002
    depends_on:
      - order-service
      - payment-service
    ports:
      - "3000:3000"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
