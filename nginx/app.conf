# Reverse proxy that exposes all THREE running deployment modes on port
# 80, side by side, distinguished by URL path:
#
#   http://<host>/systemd/   -> frontend running under systemd, port 3001
#   http://<host>/pm2/       -> frontend running under PM2,     port 3002
#   http://<host>/docker/    -> frontend running under Docker,  port 3003
#   http://<host>/           -> landing page linking to all three
#
# Each frontend already proxies its own /api/orders and /api/payments
# internally to its matching backend pair (order/payment on 4011/4021
# for systemd, 4012/4022 for PM2, 4013/4023 for Docker) so nginx only
# ever needs to forward to the frontend port for that mode.
#
# Install:
#   sudo cp nginx/app.conf /etc/nginx/sites-available/app.conf
#   sudo ln -sf /etc/nginx/sites-available/app.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=applimit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log;

    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Order/Payment Console</title>
        <style>body{background:#0F1310;color:#E9EFE7;font-family:ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;gap:16px}
        a{color:#6FE39B;font-size:18px;text-decoration:none;border:1px solid #2A322B;padding:12px 24px;border-radius:8px}
        a:hover{border-color:#6FE39B}h1{font-weight:500}</style></head>
        <body><h1>Pick a deployment mode</h1>
        <a href="/systemd/">systemd — :3001</a>
        <a href="/pm2/">PM2 — :3002</a>
        <a href="/docker/">Docker — :3003</a>
        </body></html>';
    }

    location /systemd/ {
        limit_req zone=applimit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pm2/ {
        limit_req zone=applimit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docker/ {
        limit_req zone=applimit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
