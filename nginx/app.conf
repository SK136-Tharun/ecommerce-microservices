# Reverse proxy: exposes the whole app on port 80.
# The frontend app already proxies /api/orders and /api/payments internally,
# so nginx only needs to forward everything to the frontend on :3000.
#
# Install: sudo cp nginx/app.conf /etc/nginx/sites-available/app.conf
#          sudo ln -s /etc/nginx/sites-available/app.conf /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=applimit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log;

    location / {
        limit_req zone=applimit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
